<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - ASLN</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/premium.css">
<script>(function(){try{document.documentElement.setAttribute("data-theme", localStorage.getItem("aslnTheme")||"dark");}catch(e){}})();</script>
</head>
<body class="auth-page">

<header>
    <a href="index.html" class="logo">ASLN</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="discover.html">Discover</a>
        <a href="signup.html">Sign Up</a>
    </nav>
</header>

<div class="auth-container">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your ASLN account</p>

    <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p class="auth-link">
        Don't have an account? <a href="signup.html">Sign up</a>
    </p>
</div>

<script src="js/app.js"></script>
<script src="js/premium.js"></script>
<script src="js/script.js"></script>
</body>
</html>
