<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASLN Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <a href="index.html" class="logo">ASLN</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="discover.html">Discover</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
    </nav>
</header>

<section class="single-profile">

    <div class="single-profile-card">

        <img
            id="publicProfileImage"
            src="images/lady09.png"
            alt="ASLN Profile"
            class="single-profile-image"
        >

        <div class="single-profile-info">

            <h1 id="publicProfileName">Sarah, 24</h1>

            <p class="profile-location" id="publicProfileLocation">
                📍 Kampala, Uganda
            </p>

            <p class="profile-bio" id="publicProfileBio">
                Loves travel, music and entrepreneurship.
            </p>

            <h2>Interests</h2>

            <div class="profile-interests" id="publicProfileInterests">
            </div>

            <div class="profile-actions">

                <button
    class="like-btn"
    id="publicLikeButton">
    ♡ Like
</button>

                <button
                    class="message-btn"
                    onclick="window.location.href='messages.html'">
                    💬 Message
                </button>

            </div>

            <a href="discover.html" class="back-link">
                ← Back to Discover
            </a>

        </div>

    </div>

</section>

<footer>
    <p>&copy; 2026 ASLN - African Single Ladies' Network</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
