<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Discover - ASLN</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="discover-page">

<header class="main-header">
    <a href="index.html" class="logo"><h1>ASLN</h1><span>African Single Ladies' Network</span></a>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="discover.html" class="active">Discover</a>
        <a href="gallery.html">Moments</a>
        <a href="messages.html">Messages</a>
        <a href="profile.html">Profile</a>
        <a href="signup.html" class="join-btn">Join Free</a>
    </nav>
</header>

<section class="discover-swipe">
    <div class="discover-header">
        <h1>Discover</h1>
        <p>Swipe right to like · left to pass · up for super like</p>
    </div>

    <div class="filter-bar">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="uganda">Uganda</button>
        <button class="filter-chip" data-filter="kenya">Kenya</button>
        <button class="filter-chip" data-filter="nigeria">Nigeria</button>
        <button class="filter-chip" data-filter="travel">Travel</button>
    </div>

    <div class="swipe-area">
        <div id="cardStack" class="card-stack"></div>
    </div>

    <div class="swipe-actions">
        <button id="btnPass" class="action-btn pass-btn" title="Pass">✕</button>
        <button id="btnSuper" class="action-btn super-btn" title="Super Like">★</button>
        <button id="btnLike" class="action-btn like-action-btn" title="Like">♥</button>
    </div>

    <p class="discover-footer-link"><a href="discover-grid.html">Browse grid view →</a></p>
</section>

<div id="matchModal" class="match-modal">
    <div class="match-content">
        <div class="match-sparkles">✨</div>
        <h2>It's a Match!</h2>
        <p>You and <span id="matchName"></span> liked each other</p>
        <img id="matchImg" src="" alt="Match">
        <div class="match-btns">
            <button id="msgMatch">Send Message</button>
            <button id="closeMatch" class="secondary">Keep Swiping</button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" data-page="index.html">🏠<span>Home</span></a>
    <a href="discover.html" data-page="discover.html">💫<span>Discover</span></a>
    <a href="gallery.html" data-page="gallery.html">📸<span>Moments</span></a>
    <a href="messages.html" data-page="messages.html">💬<span>Messages</span></a>
    <a href="profile.html" data-page="profile.html">👤<span>Profile</span></a>
</nav>

<script src="js/app.js"></script>
<script src="js/discover.js"></script>
</body>
</html>
