<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - ASLN</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <a href="index.html" class="logo">ASLN</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="discover.html">Discover</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
    </nav>
</header>

<section class="profile-section">
    <div class="profile-container">
        <img id="profileImage"
             src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300&h=300&fit=crop"
             alt="Profile Photo"
             class="profile-photo">

        <h2 id="userName">Sarah</h2>
        <p class="location">Kampala, Uganda</p>

        <div class="profile-details">
            <p><strong>Age:</strong> 25</p>
            <p><strong>Email:</strong> <span id="userEmail">sarah@example.com</span></p>
            <p><strong>Interests:</strong> Music, Travel, Sports</p>
        </div>

        <p class="bio">
            I am looking for meaningful connections
            and long-term relationships with someone who shares my values.
        </p>

        <button class="connect-btn">Send Message</button>
    </div>
</section>

<footer>
    <p>&copy; 2026 ASLN - African Single Ladies' Network</p>
</footer>

<script src="js/script.js"></script>

</html>
